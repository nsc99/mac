name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple Silicon, so aarch64-darwin builds natively.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      # Pre-commit hooks (nixfmt, statix, deadnix) on all files.
      - run: nix flake check
      - run: nix build .#darwinConfigurations.mac.system --no-link
